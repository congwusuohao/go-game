<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萌趣算术</title>
<style>
:root {
  --bg: #FFF8E7;
  --cell-off: #E8E0D0;
  --btn-bg: #81C784;
  --btn-correct: #4CAF50;
  --btn-wrong: #FF7043;
  --text-dark: #5D4037;
  --text-light: #8D6E63;
  /* 左右加数颜色（由 JS 动态设置，每局随机） */
  --color-left:  #66BB6A;
  --color-right: #AB47BC;
  --color-left-dark:  #388E3C;
  --color-right-dark: #7B1FA2;
  --color-left-light: #A5D6A7;
  --color-right-light: #CE93D8;
  --color-left-alpha: rgba(102,187,106,0.5);
  --color-right-alpha: rgba(171,71,188,0.5);
  --shadow: rgba(0,0,0,0.12);
  --cell-w: 72px;
  --cell-h: 36px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  min-height: 100vh; overflow: hidden; user-select: none;
}
#app { display: flex; width: 100vw; height: 100vh; }

/* ── 三区顶行（题目列表 + 游戏+答题） ─────────────── */
#main-row { display: flex; flex: 1; min-height: 0; }

/* ── 左侧题目列表 ──────────────────────────────────── */
#question-panel {
  width: 240px; min-width: 200px;
  background: linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 100%);
  border-right: 3px solid #FFCC80;
  display: flex; flex-direction: column;
  padding: 12px 10px;
  overflow: hidden; /* 自身不滚动，由子元素控制 */
}
#question-panel-header {
  flex-shrink: 0; /* 头部固定顶部 */
}
#question-list {
  flex: 1; min-height: 0; /* 占据剩余空间，可滚动 */
  overflow-y: auto; overflow-x: hidden;
}
#custom-q-btn {
  flex-shrink: 0; /* 按钮固定在底部，不随列表下沉 */
}
#question-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 2px dashed #FFCC80;
}
#question-panel-title { font-size: 18px; font-weight: 800; color: var(--text-dark); }
#question-progress { font-size: 14px; font-weight: 700; color: var(--text-light); background: rgba(255,255,255,0.6); padding: 4px 10px; border-radius: 12px; }
.question-card {
  background: white; border-radius: 12px; padding: 12px 8px;
  margin-bottom: 10px; text-align: center; cursor: pointer;
  transition: all 0.3s; box-shadow: 0 2px 8px var(--shadow);
  border: 2px solid transparent; position: relative;
  white-space: nowrap; overflow: hidden;
}
.question-card.locked::before {
  content: attr(data-num);
  position: absolute; top:0; left:0; right:0; bottom:0;
  background: #F5F5F5; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: #BDBDBD; z-index: 1;
}
.question-card.current { border-color: #4CAF50; background: #E8F5E9; transform: scale(1.04); }
.question-card.done { background: #C8E6C9; }
.question-card.custom-q {
  background: linear-gradient(135deg, #FFF9C4, #FFE082);
  border: 2px solid #FFD54F;
}
.question-card.custom-q::before {
  content: '✨';
  position: absolute; top: 4px; right: 8px;
  font-size: 14px;
}
#custom-q-btn {
  background: linear-gradient(135deg,#FFD54F,#FFA000);
  color: #5D4037; border: none; border-radius: 14px;
  padding: 9px 20px; font-size: 15px; font-weight: 800;
  cursor: pointer; box-shadow: 0 4px 12px rgba(255,160,0,0.35);
  transition: transform 0.12s, box-shadow 0.12s;
  width: 100%; margin-top: 8px;
}
#custom-q-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255,160,0,0.45); }
#custom-q-btn:active { transform: translateY(0); }

#custom-keypad-overlay.hidden { display: none; }

/* 自定义键盘模态 */
#custom-keypad-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
}
#custom-keypad-panel {
  background: #FFF8E7; border-radius: 20px;
  padding: 18px 16px 20px; min-width: 300px; max-width: 380px; width: 90vw;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
#custom-keypad-title { font-size: 18px; font-weight: 800; color: var(--text-dark); }
#custom-preview {
  width: 100%; padding: 10px 14px; border-radius: 12px;
  background: white; border: 2px solid #FFD54F;
  font-size: 26px; font-weight: 800; color: var(--text-dark);
  text-align: center; letter-spacing: 6px; min-height: 50px;
  display: flex; align-items: center; justify-content: center;
}
#custom-preview.error { border-color: #FF7043; color: #FF7043; }
#custom-error {
  font-size: 13px; color: #FF7043; min-height: 18px;
  font-weight: 600; text-align: center;
}
/* 4行4列：1-9数字 + 0 + 操作符 + 确认 */
#custom-pad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  width: 100%;
}
.c-key {
  padding: 11px 4px; border-radius: 12px; border: none;
  font-size: 20px; font-weight: 700; cursor: pointer;
  background: white; color: var(--text-dark);
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
  transition: transform 0.1s, box-shadow 0.1s;
  aspect-ratio: 1.4;
  display: flex; align-items: center; justify-content: center;
}
.c-key:active { transform: scale(0.94); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.c-key-num  { background: white; }
.c-key-op   { background: #FFE082; color: #5D4037; font-size: 24px; }
.c-key-del  { background: #FF7043; color: white; font-size: 17px; }
.c-key-conf { background: linear-gradient(135deg,#81C784,#4CAF50); color: white; font-size: 24px; }
.c-key-0    { background: white; grid-column: 1 / 3; aspect-ratio: auto; }
#custom-keypad-btns { display: flex; gap: 10px; width: 100%; margin-top: 4px; }
#custom-cancel-btn {
  background: #EEEEEE; color: #757575; font-size: 14px;
  padding: 10px; border-radius: 12px; border: none;
  cursor: pointer; width: 100%; margin-top: 2px;
  transition: transform 0.1s;
}
#custom-cancel-btn:active { transform: scale(0.97); }
.q-formula { font-size: 24px; font-weight: 800; color: var(--text-dark); }

/* ── 中间游戏区 ──────────────────────────────────── */
#center-area { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#game-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 20px; overflow-y: auto; min-height: 0; }

/* 算式区 */
#formula { font-size: clamp(26px,5vw,42px); font-weight: 800; color: var(--text-dark); letter-spacing: 4px; text-align: center; margin: 8px 0; }
#formula-display { display: flex; align-items: center; justify-content: center; width: 100%; }
.formula-wrap { width: 80px; flex-shrink: 0; }
.formula-num {
  width: 80px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  background: white; border-radius: 12px;
  box-shadow: 0 3px 12px var(--shadow);
  font-weight: 800; font-size: 28px;
  transition: all 0.3s;
}
#formula-a1.left-hl { background: var(--color-left-dark) !important; color: white !important; }
#formula-a2.right-hl { background: var(--color-right-dark) !important; color: white !important; }
.formula-op { width: 50px; text-align: center; color: var(--text-light); font-size: 26px; font-weight: 700; flex-shrink: 0; }
#formula-ans { background: #FFE082 !important; color: #5D4037 !important; border: 2px solid #FFB300 !important; }
#formula-ans.ans-reveal { animation: ansPop 0.5s ease; }
@keyframes ansPop { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }

/* 游戏区 */
#game-stage-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 520px; position: relative; }
#game-cols { display: flex; align-items: flex-start; justify-content: center; width: 100%; margin-top: 16px; gap: 60px; }
.col-section { display: flex; flex-direction: column; align-items: center; }
.section-hint { font-size: 13px; font-weight: 700; color: var(--text-light); margin-bottom: 6px; min-width: 80px; width: 80px; text-align: center; white-space: nowrap; }
#left-hint.left-hl  { color: var(--color-left-dark); }
#right-hint.right-hl { color: var(--color-right-dark); }
#left-hint.merge-hl  { color: var(--text-dark); }
#right-hint.merge-hl { color: var(--text-dark); }
.col { display: flex; flex-direction: row; gap: 6px; }
.cell-col { display: flex; flex-direction: column; gap: 3px; }
.cell-col .cell:nth-child(5) { margin-bottom: 6px; }  /* 第5个和第6个之间加分隔 */
.col-locked { opacity: 0.35; pointer-events: none; }
.cell-locked { background: var(--cell-off) !important; border-color: #ccc !important; cursor: not-allowed; }
.cell {
  height: var(--cell-h); width: var(--cell-w);
  min-height: var(--cell-h); min-width: var(--cell-w);
  max-height: var(--cell-h); max-width: var(--cell-w);
  border-radius: 8px; border: 2px solid #D4C4A8;
  background: var(--cell-off);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
  position: relative; overflow: hidden;
  box-sizing: border-box;
}
.cell.on { z-index: 1; }

/* 减法红斜杠标记 */
.cell.slashed {
  background: rgba(255,82,82,0.25) !important;
  border-color: #FF5252 !important;
}
.cell.slashed::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom right, transparent 42%, #FF5252 42%, #FF5252 58%, transparent 58%);
  border-radius: 8px; pointer-events: none;
}

/* 6种格子状态 */
.cell.empty-usable  { cursor: pointer; }                                        /* 空可用 */
.cell.empty-used    { cursor: default; opacity: 0.45; }                         /* 空不可用 */
.cell.empty-done    { cursor: default; opacity: 0.3; }                           /* 空完成 */
.cell.on-usable     { cursor: pointer; }                                          /* 亮可用 */
.cell.on-used       { cursor: default; }                                          /* 亮不可用 */
.cell.on-done       { cursor: default; }                                          /* 亮完成 */

/* 亮格颜色 */
.cell.on.left-origin  { background: var(--color-left-light); border-color: var(--color-left); color: var(--color-left-dark); box-shadow: 0 4px 12px var(--color-left-alpha); } /* 左格来源左→左色 */
.cell.on.right-origin { background: var(--color-right-light); border-color: var(--color-right); color: var(--color-right-dark); box-shadow: 0 4px 12px var(--color-right-alpha); } /* 右格来源右→右色 */
.cell.on.left-swapped { background: var(--color-right-light); border-color: var(--color-right); color: var(--color-right-dark); box-shadow: 0 4px 12px var(--color-right-alpha); } /* 左格来源右→保留右色 */
.cell.on.right-swapped{ background: var(--color-left-light); border-color: var(--color-left); color: var(--color-left-dark); box-shadow: 0 4px 12px var(--color-left-alpha); } /* 右格来源左→保留左色 */

.cell.pop { animation: pop 0.2s ease-out; }
@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1.05)} }
.highlight { animation: glow 0.35s ease; }
@keyframes glow { 0%,100%{box-shadow:0 0 0 rgba(255,200,0,0)} 50%{box-shadow:0 0 24px rgba(255,200,0,0.9)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

/* ── 底部答题区（流动高度，不固定） ──────────────── */
#answer-area {
  background: white; border-top: 3px solid #FFCC80;
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: center;
  min-height: 90px; flex-shrink: 0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
}
#answer-mode-area.hidden { display: none; }

/* 默认行：提示居中容器 + 答题按钮(右) */
#answer-default-row {
  display: flex; align-items: center;
  width: 100%; height: 100%;
}
/* 左侧弹性区包裹提示文字，让文字居中 */
#answer-prompt-wrap {
  flex: 1; text-align: center;
}
#answer-prompt {
  font-size: 18px; font-weight: 700; color: var(--text-dark);
  display: inline;
}

/* 答题/关闭 切换按钮（固定在最右侧） */
#answer-mode-btn {
  background: linear-gradient(135deg,#BA68C8,#AB47BC);
  color: white; border: none; border-radius: 14px;
  padding: 10px 28px; font-size: 16px; font-weight: 800;
  cursor: pointer; box-shadow: 0 4px 14px rgba(171,71,188,0.4);
  transition: transform 0.1s; white-space: nowrap;
  flex-shrink: 0; margin-right: 16px;
}
#answer-mode-btn:active { transform: scale(0.95); }
#answer-mode-btn.close-mode {
  background: linear-gradient(135deg,#78909C,#607D8B);
  box-shadow: 0 4px 14px rgba(96,125,139,0.4);
}

#sub-delete-area.hidden, #sub-delete-btn.hidden { display: none; }
#sub-delete-area {
  text-align: center;
  position: absolute;
  right: 0;
  bottom: 0;
  z-index: 10;
}
#sub-delete-btn {
  background: linear-gradient(135deg,#4CAF50,#2E7D32);
  color: white; border: none; border-radius: 14px;
  padding: 12px 32px; font-size: 20px; font-weight: 900;
  cursor: pointer; box-shadow: 0 4px 16px rgba(76,175,80,0.5);
  transition: transform 0.1s;
}
#sub-delete-btn:active { transform: scale(0.94); }

/* 答题模式：左侧弹性区(键盘+输入) + 右侧关闭按钮 */
#answer-mode-area {
  display: flex; align-items: center;
  width: 100%; height: 100%;
}
#answer-mode-left {
  display: flex; align-items: center; justify-content: center;
  flex: 1; gap: 10px;
}

/* 数字键盘 */
#num-pad { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
.num-btn {
  background: linear-gradient(135deg,#81C784,#66BB6A);
  color: white; border: none; border-radius: 10px;
  padding: 8px 4px; font-size: 20px; font-weight: 800;
  cursor: pointer; box-shadow: 0 3px 8px rgba(102,187,106,0.4);
  transition: transform 0.1s; min-width: 52px; height: 50px;
}
.num-btn:active { transform: scale(0.95); }

/* 输入区：删除 - 输入框 - 确认 */
#answer-input-row {
  display: flex; align-items: center; gap: 6px;
}
#answer-display {
  display: flex; align-items: center; justify-content: center;
  min-width: 70px; max-width: 100px; height: 50px;
  background:#FFF8E7; border:2px solid #FFCC80; border-radius:10px;
  font-size: 22px; font-weight: 800; color: var(--text-dark);
  letter-spacing: 4px; padding: 0 6px;
}
.ans-digit { min-width: 16px; text-align: center; display: inline-block; }
.ans-digit.filled { color: var(--text-dark); }
#clr-btn {
  background:#FF7043; color:white; border:none; border-radius:10px;
  padding:0 16px; font-size:18px; font-weight:800; cursor:pointer;
  height: 50px; box-sizing: border-box;
}
#submit-btn {
  background: linear-gradient(135deg,#4CAF50,#388E3C);
  color: white; border: none; border-radius: 10px;
  padding: 0 16px; font-size: 18px; font-weight: 800; cursor: pointer;
  height: 50px; box-sizing: border-box;
}
#submit-btn:disabled { background: #ccc; cursor: not-allowed; }

/* 关闭按钮 — 与答题按钮同位、同尺寸 */
#answer-close-btn {
  background: linear-gradient(135deg,#78909C,#607D8B);
  color: white; border: none; border-radius: 14px;
  padding: 10px 28px; font-size: 16px; font-weight: 800;
  cursor: pointer; box-shadow: 0 4px 14px rgba(96,125,139,0.4);
  transition: transform 0.1s; white-space: nowrap;
  flex-shrink: 0; margin-right: 16px;
}
#answer-close-btn:active { transform: scale(0.95); }
#answer-close-btn.hidden { display: none; }

/* ── 结算 ──────────────────────────────────── */
#score-screen { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; flex-direction: column; }
#score-screen.show { display: flex; }
#score-card { background: white; border-radius: 24px; padding: 40px; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.3); max-width: 400px; width: 90%; }
#score-stars { font-size: clamp(48px,10vw,72px); letter-spacing: 8px; }
#score-percent { font-size: clamp(56px,12vw,88px); font-weight:900; color: var(--btn-correct); }
#score-title { font-size: clamp(28px,7vw,48px); font-weight:900; color: var(--text-dark); margin-top:8px; }
#score-detail { font-size: clamp(16px,4vw,22px); color: var(--text-light); line-height: 1.8; margin-top:12px; }
#score-replay {
  background: linear-gradient(135deg,#81C784 40%,#4CAF50);
  color: white; border: none; border-radius: 16px; padding: 14px 32px;
  font-size: 18px; font-weight: 800; cursor: pointer;
  box-shadow: 0 6px 20px rgba(76,175,80,0.4); margin-top: 24px;
}
#score-replay:active { transform: scale(0.95); }

/* ── 彩带 & canvas ──────────────────────────────────── */
canvas#reward-canvas { position: fixed; top:0; left:0; pointer-events:none; z-index: 250; }
.confetti {
  position: fixed; top: -20px; border-radius: 3px;
  pointer-events: none; z-index: 251;
  animation: confettiFall var(--dur,2s) linear forwards;
}
@keyframes confettiFall { to{transform:translateY(110vh) rotate(720deg); opacity:0;} }

/* ── 设置页 ──────────────────────────────────── */
#setup-screen {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: var(--bg); z-index: 500;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
#setup-title { font-size: 48px; margin-bottom: 8px; }
#setup-sub { font-size: 18px; color: var(--text-light); margin-bottom: 16px; }
.setup-card {
  background: white; padding: 20px 28px; border-radius: 16px;
  box-shadow: 0 4px 20px var(--shadow);
  display: flex; flex-direction: column; gap: 12px;
}
.setup-card-title { font-size: 16px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
.setup-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 17px; }
.setup-row input { width: 20px; height: 20px; }
.qsel-row {
  display: flex; align-items: center; gap: 16px;
  background: white; padding: 16px 24px; border-radius: 16px;
  box-shadow: 0 4px 20px var(--shadow);
}
.qsel-num { font-size: 28px; font-weight: 900; color: var(--text-dark); }
.qsel-label { font-size: 13px; color: var(--text-light); }
#start-btn {
  background: linear-gradient(135deg,#4CAF50,#388E3C); color: white;
  border: none; border-radius: 16px; padding: 16px 48px;
  font-size: 20px; font-weight: 800; cursor: pointer;
  box-shadow: 0 6px 20px rgba(76,175,80,0.4);
}
#start-btn:active { transform: scale(0.97); }

/* ── 勋章 ──────────────────────────────────── */
#medal-banner {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg,#FFD700,#FFA000);
  color: white; font-size: 18px; font-weight: 800;
  padding: 12px 28px; border-radius: 50px;
  box-shadow: 0 4px 20px rgba(255,160,0,0.5);
  z-index: 300; white-space: nowrap;
  display: none;
}
#medal-banner.show { display: block; animation: medalIn 0.5s ease; }
@keyframes medalIn { 0%{transform:translateX(-50%) translateY(-30px); opacity:0} 100%{transform:translateX(-50%) translateY(0); opacity:1} }

/* ── 响应式 ──────────────────────────────────── */
@media (max-width: 768px) { #question-panel { display: none; } }
</style>
</head>
<body>

<!-- 设置页 -->
<div id="setup-screen">
  <div id="setup-title">🐰 萌趣算术 🐱</div>
  <div id="setup-sub">帮小动物们学会算术吧！</div>
  <div class="setup-card">
    <div class="setup-card-title">加法</div>
    <label class="setup-row"><input type="checkbox" id="qtype-add20"> <span>20以内加法（1+1 到 10+10）</span></label>
    <label class="setup-row"><input type="checkbox" id="qtype-add40"> <span>40以内加法（11+1 到 20+20）</span></label>
  </div>
  <div class="setup-card" style="margin-top:12px">
    <div class="setup-card-title">减法</div>
    <label class="setup-row"><input type="checkbox" id="qtype-sub10"> <span>10以内减法（被减数≤10）</span></label>
    <label class="setup-row"><input type="checkbox" id="qtype-sub20"> <span>20以内减法（被减数11~20）</span></label>
    <label class="setup-row"><input type="checkbox" id="qtype-sub40"> <span>40以内减法（被减数21~40）</span></label>
  </div>
  <div class="qsel-row">
    <button id="qsel-minus" style="background:var(--btn-bg);color:white;border:none;border-radius:8px;width:40px;height:40px;font-size:20px;font-weight:800;cursor:pointer">−</button>

<script>
// ═══════════════════════════════════════════════════
//  常量
// ═══════════════════════════════════════════════════
const PER_COL      = 10;   // 每列格子数
const TOTAL_CELLS  = 20;   // 每侧数组/格子最大数（40以内最大 a1=20 / a2=20）

const ANIMAL_POOL  = ['🐶','🐱','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦋','🐝','🐢','🐙','🦄','🐲','🦕','🐳','🦩','🦜'];
const FRUIT_POOL   = ['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🍒','🍑','🥭','🍍','🥝','🍅','🥥','🍏'];

// 左右颜色对：每组 [左侧亮色, 左侧暗色, 右侧亮色, 右侧暗色]
const COLOR_SCHEMES = [
  ['#81C784','#388E3C','#CE93D8','#7B1FA2'],  // 绿 vs 紫
  ['#FFD54F','#F57F17','#80DEEA','#0277BD'],  // 黄 vs 青
  ['#F48FB1','#C2185B','#A5D6A7','#2E7D32'],  // 粉 vs 绿
  ['#FFCC80','#E65100','#B39DDB','#512DA8'],  // 橙 vs 靛
  ['#A1887F','#4E342E','#90CAF9','#1565C0'],  // 棕 vs 蓝
  ['#80CBC4','#00695C','#FFAB91','#D84315'],  // 青 vs 珊瑚
];

// ═══════════════════════════════════════════════════
//  状态
// ═══════════════════════════════════════════════════
let phase         = 'idle';   // idle | left | right | merge | answer | done
let answerState   = false;    // false=未答题状态 true=答题状态

let streakCount   = 0;

let subtrahendMarked = new Set();        // 减法：标记为减数的格子索引（leftOn 中的）

// 格子数据（长度固定 = TOTAL_CELLS = 10）
let leftOn      = [], rightOn     = [];

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function countOn(arr) { let n = 0; for (let i = 0; i < arr.length; i++) if (arr[i]) n++; return n; }
function pick(arr, exclude) {
  let pool = exclude ? arr.filter(e => e !== exclude) : arr;
  return pool[randInt(0, pool.length - 1)];
}

// ═══════════════════════════════════════════════════
//  语音
// ═══════════════════════════════════════════════════
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.85; u.pitch = 1.1;
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════════════════════════
//  音效
// ═══════════════════════════════════════════════════
function playTone(freq, dur, type = 'sine', vol = 0.15) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playClick()   { playTone(800, 0.05, 'sine', 0.1); }
function playCorrect() {
  playTone(523.25, 0.15, 'sine', 0.3);
  setTimeout(() => playTone(659.25, 0.15, 'sine', 0.3), 100);
  setTimeout(() => playTone(783.99, 0.25, 'sine', 0.3), 200);
}
function playWrong()   { playTone(180, 0.3, 'sawtooth', 0.25); }

// ═══════════════════════════════════════════════════
//  题目生成
// ═══════════════════════════════════════════════════
function generateQuestions() {
  questions = [];
  const seen = new Set();
  const add20 = document.getElementById('qtype-add20').checked;
  const add40 = document.getElementById('qtype-add40').checked;
  const sub10 = document.getElementById('qtype-sub10').checked;
  const sub20 = document.getElementById('qtype-sub20').checked;
  const sub40 = document.getElementById('qtype-sub40').checked;
  const types = [];
  if (add20) types.push('add20');
  if (add40) types.push('add40');
  if (sub10) types.push('sub10');
  if (sub20) types.push('sub20');
  if (sub40) types.push('sub40');
  if (types.length === 0) types.push('add20');

  while (questions.length < totalQuestions) {
    const type = types[randInt(0, types.length - 1)];
    let q1, q2, answer;
    if (type === 'add20') {
      q1 = randInt(1, 10); q2 = randInt(1, 10);
      answer = q1 + q2;
    } else if (type === 'add40') {
      if (Math.random() < 0.5) { q1 = randInt(11, 20); q2 = randInt(1, 20); }
      else                    { q1 = randInt(1, 20);  q2 = randInt(11, 20); }
      if (q1 + q2 > 40) {
        if (q1 > 20) q1 = 40 - q2; else q2 = 40 - q1;
      }
      answer = q1 + q2;
    } else if (type === 'sub10') {
      q1 = randInt(1, 10); q2 = randInt(1, q1);
      answer = q1 - q2;
    } else if (type === 'sub20') {
      q1 = randInt(11, 20); q2 = randInt(1, q1);
      answer = q1 - q2;
    } else { // sub40
      q1 = randInt(21, 40); q2 = randInt(1, q1);
      answer = q1 - q2;
    }
    const key = type + ':' + Math.min(q1,q2) + ',' + Math.max(q1,q2);
    if (!seen.has(key) && q1 >= 1 && q2 >= 1) {
      seen.add(key);
      questions.push({ a1: q1, a2: q2, answer, type, done: false, hasWrong: false });
    }
    if (seen.size > totalQuestions * 30) break;
  }
  renderQuestionList();
}

function renderQuestionList() {
  questionList.innerHTML = '';
  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    if (q.isCustom) card.classList.add('custom-q');
    if (idx === currentRound - 1) card.classList.add('current');
    else if (q.done) card.classList.add('done');
    else card.classList.add('locked');
    card.dataset.num = String(idx + 1);
    const ansPart = q.done ? '= ' + q.answer : '= ?';
    const op = q.type.startsWith('sub') ? '−' : '+';
    card.innerHTML = '<div class="q-formula">' + q.a1 + ' ' + op + ' ' + q.a2 + ' ' + ansPart + '</div>';
    card.addEventListener('click', () => {
      if (idx >= currentRound) speak('先把前面的题做完吧');
      else if (q.done) speak('这题已经做完啦');
    });
    questionList.appendChild(card);
  });
  const pg = document.getElementById('question-progress');
  if (pg) pg.textContent = currentRound + '/' + questions.length;
}

// ═══════════════════════════════════════════════════
//  Emoji 分配（游戏开局时随机决定：全动物 或 全水果）
// ═══════════════════════════════════════════════════
let emojiType = 'animal';  // 'animal' | 'fruit'
let emojiPool  = [];

// 将 #RRGGBB 转为 rgba(r,g,b,a)
function alphaColor(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
// 将 #RRGGBB 混 60% 白色得到浅色
function lightColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const wr = Math.round(r + (255 - r) * 0.60);
  const wg = Math.round(g + (255 - g) * 0.60);
  const wb = Math.round(b + (255 - b) * 0.60);
  return '#' + wr.toString(16).padStart(2,'0') + wg.toString(16).padStart(2,'0') + wb.toString(16).padStart(2,'0');
}

function applyColors() {
  const scheme = COLOR_SCHEMES[Math.floor(Math.random() * COLOR_SCHEMES.length)];
  document.documentElement.style.setProperty('--color-left',       scheme[0]);
  document.documentElement.style.setProperty('--color-left-dark',  scheme[1]);
  document.documentElement.style.setProperty('--color-right',      scheme[2]);
  document.documentElement.style.setProperty('--color-right-dark', scheme[3]);
  // JS 计算浅色（60% 透明度叠加白色）和阴影色
  document.documentElement.style.setProperty('--color-left-light',  lightColor(scheme[0]));
  document.documentElement.style.setProperty('--color-right-light', lightColor(scheme[2]));
  document.documentElement.style.setProperty('--color-left-alpha',  alphaColor(scheme[0], 0.45));
  document.documentElement.style.setProperty('--color-right-alpha', alphaColor(scheme[2], 0.45));
}

function assignEmojis() {
  // 每道题随机选择 emoji 类型和两个不同的 emoji
  emojiType = Math.random() < 0.5 ? 'animal' : 'fruit';
  const pool = emojiType === 'animal' ? ANIMAL_POOL : FRUIT_POOL;
  const copy = [...pool];
  shuffle(copy);
  leftEmoji = copy[0];   // 左侧所有格子用同一个 emoji
  rightEmoji = copy[1] || copy[0];  // 右侧所有格子用另一个 emoji
  // 随机颜色对
  applyColors();
}

function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

// ═══════════════════════════════════════════════════
//  格子构建
//  initTotal        = 该侧初始化格子数（按列数来：≤10 → 10，≥11 → 20）
//  actualCount      = 该侧实际加数（超出部分初始为 empty-done）
//  unlockedCols     = 该阶段已解锁列数（只解锁这么多列，余下锁定）
// ═══════════════════════════════════════════════════
function buildCol(container, initTotal, unlockedCols) {
  container.innerHTML = '';
  const colCount = Math.ceil(initTotal / PER_COL);
  console.log('=== buildCol === initTotal=' + initTotal + ' colCount=' + colCount + ' PER_COL=' + PER_COL);
  let cellCount = 0;
  for (let c = 0; c < colCount; c++) {
    const subCol = document.createElement('div');
    subCol.className = 'cell-col';
    for (let r = 0; r < PER_COL; r++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const idx = c * PER_COL + r;
      cell.dataset.idx = idx;
      cell.dataset.col = c;
      cell.addEventListener('click', onCellClick);
      subCol.appendChild(cell);
      cellCount++;
    }
    container.appendChild(subCol);
  }
  console.log('buildCol created', cellCount, 'cells');
}

// ═══════════════════════════════════════════════════
//  格子状态（6种）
//  空：empty-usable / empty-used / empty-done
//  亮：on-usable    / on-used    / on-done
// ═══════════════════════════════════════════════════
function getLeftCellClass(idx, lit) {
  if (!lit) {
    // ── 空格子 ──
    if (phase === 'left')  return 'empty-usable';  // left阶段：左侧空格可点
    if (phase === 'right') return 'empty-done';    // right阶段：左侧已结束，空格变暗
    if (phase === 'merge' || phase === 'done') return 'empty-done';
    return 'empty-used';
  }
  // ── 亮格子 ──
  if (phase === 'left')  return 'on-done';        // left阶段：左侧已亮格锁定
  if (phase === 'right') return 'on-done';        // right阶段：左侧格已锁定
  if (phase === 'merge') return 'on-usable';      // merge阶段：可以挪
  if (phase === 'done')  return 'on-done';
  return 'on-used';
}

function getRightCellClass(idx, lit) {
  if (!lit) {
    // ── 空格子 ──
    if (phase === 'left')  return 'empty-used';   // left阶段：右侧不可点
    if (phase === 'right') return 'empty-usable'; // right阶段：右侧空格可点
    if (phase === 'merge' || phase === 'done') return 'empty-done';
    return 'empty-used';
  }
  // ── 亮格子 ──
  if (phase === 'left')  return 'on-used';        // left阶段：右侧不可用
  if (phase === 'right') return 'on-usable';      // right阶段：右侧可继续点
  if (phase === 'merge') return 'on-usable';      // merge阶段：可以挪
  if (phase === 'done')  return 'on-done';
  return 'on-used';
}

function getLeftCellColor(idx, lit) {
  if (!lit) return '';
  const src = srcLeft[idx];
  if (src === 'left')  return 'left-origin';    // 左原本-绿
  if (src === 'right') return 'left-swapped';   // 左格来自右-紫
  return '';
}

function getRightCellColor(idx, lit) {
  if (!lit) return '';
  const src = srcRight[idx];
  if (src === 'right') return 'right-origin';  // 右原本-紫
  if (src === 'left')  return 'right-swapped'; // 右格来自左-绿
  return '';
}

// 每侧初始化格子数（newRound时由buildCol决定）
let leftInitTotal  = 10;
let rightInitTotal = 10;
let leftUnlockedCols  = 1;  // left 阶段已解锁列数（1或2）
let rightUnlockedCols = 1;  // right 阶段已解锁列数（1或2）

function renderCells() {
  console.log('=== renderCells === leftInitTotal=', leftInitTotal, 'leftAnimal.length=', leftAnimal.length);
  colLeft.querySelectorAll('.cell').forEach((c, i) => {
    if (i >= leftInitTotal) return;
    const lit = leftOn[i];
    c.className = 'cell';
    c.classList.add(getLeftCellClass(i, lit));
    if (lit) {
      c.classList.add('on');
      c.classList.add(getLeftCellColor(i, lit));
    }
    // 减法：标记为减数的格子显示红斜杠
    if (isSub && subtrahendMarked.has(i)) {
      c.classList.add('slashed');
    }
    const emoji = lit ? leftAnimal[i] : '';
    c.textContent = emoji;
    // 只打印每列第一个格子的日志
    if (i % PER_COL === 0) {
      console.log('cell[' + i + '] lit=' + lit + ' emoji=' + emoji + ' leftAnimal[' + i + ']=' + leftAnimal[i]);
    }
  });
  colRight.querySelectorAll('.cell').forEach((c, i) => {
    if (i >= rightInitTotal) return;
    const lit = rightOn[i];
    c.className = 'cell';
    c.classList.add(getRightCellClass(i, lit));
    if (lit) {
      c.classList.add('on');
      c.classList.add(getRightCellColor(i, lit));
    }
    c.textContent = lit ? rightAnimal[i] : '';
  });
}

function animateCells(col, idx, filling) {
  const cells = col.querySelectorAll('.cell');
  if (filling) {
    for (let i = 0; i <= idx && i < cells.length; i++) {
      setTimeout(() => {
        if (cells[i]) cells[i].classList.add('pop');
        setTimeout(() => cells[i] && cells[i].classList.remove('pop'), 200);
      }, i * 30);
    }
  } else {
    for (let i = idx; i < cells.length; i++) {
      setTimeout(() => {
        if (cells[i]) cells[i].classList.add('pop');
        setTimeout(() => cells[i] && cells[i].classList.remove('pop'), 200);
      }, (i - idx) * 30);
    }
  }
}

// ═══════════════════════════════════════════════════
//  格子点击
// ═══════════════════════════════════════════════════
function onCellClick(e) {
  if (isAnimating) return;
  if (phase === 'idle') return;
  const cell = e.currentTarget;
  const idx  = parseInt(cell.dataset.idx);
  const col  = parseInt(cell.dataset.col);
  const isLeft = cell.closest('#col-left') !== null;
  const side = isLeft ? 'left' : 'right';

  // left 阶段：只能点左侧
  if (phase === 'left') {
    if (!isLeft) { playClick(); speak('先把左边完成'); return; }
    playClick();
    toggleColumn('left', idx);
    renderCells();
    animateCells(colLeft, idx, !leftOn[idx]);
    checkFill('left', leftOn, a1);
    return;
  }

  // right 阶段：只能点右侧
  if (phase === 'right') {
    if (isLeft) { playClick(); speak('先把右边完成'); return; }
    playClick();
    toggleColumn('right', idx);
    renderCells();
    animateCells(colRight, idx, !rightOn[idx]);
    checkFill('right', rightOn, a2);
    return;
  }

  // merge 阶段：任意侧触发合并
  if (phase === 'merge') {
    playClick();
    doMerge(side, idx, col);
    return;
  }

  // ── 减法阶段一：被减数（逻辑同加法 left）──
  if (phase === 'sub-minuend') {
    if (!isLeft) { playClick(); speak('请先完成被减数'); return; }
    playClick();
    toggleColumn('left', idx);
    renderCells();
    animateCells(colLeft, idx, !leftOn[idx]);
    checkFillSubMinuend();
    return;
  }

  // ── 减法阶段二：减数（标记格子）──
  if (phase === 'sub-subtrahend') {
    if (!isLeft) { playClick(); speak('请在左边标记'); return; }
    if (!leftOn[idx]) { playClick(); speak('只能标记亮格'); return; }
    playClick();
    if (subtrahendMarked.has(idx)) {
      // 已标记 → 取消该格标记
      subtrahendMarked.delete(idx);
    } else {
      // 未标记 → 标记该格
      subtrahendMarked.add(idx);
    }
    renderCells();
    checkFillSubtrahend();
    return;
  }

  // answer / done 阶段：无操作
}

// 统计某列的亮格数（列内范围：col*PER_COL 到 endIdx-1）
function countColLit(arr, col, endIdx) {
  let n = 0;
  for (let i = col * PER_COL; i < endIdx; i++) if (arr[i]) n++;
  return n;
}

// 统一列内开关
//  点 OFF → 点亮该格及该列以下（向下，不跨列）
//  点 ON  → 取消该格及该列以上（向上，不跨列）
function toggleColumn(side, idx) {
  const arr    = side === 'left' ? leftOn  : rightOn;
  const ani    = side === 'left' ? leftAnimal : rightAnimal;
  const src    = side === 'left' ? srcLeft  : srcRight;
  const srcTag = side === 'left' ? 'left' : 'right';
  const col    = Math.floor(idx / PER_COL);
  const colEnd = (col + 1) * PER_COL;  // 列尾（不跨列）
  const colStart = col * PER_COL;
  
  // 注意：不再重新选择 emoji，而是保持初始化时分配的值
  // 初始化时 ani[i] 已经用 pickLeftEmoji(i) 分配好了

  if (!arr[idx]) {
    // 点 OFF → 向下全亮（到列尾为止）
    // emoji 保持初始化时的值，不覆盖
    for (let i = idx; i < colEnd; i++) {
      arr[i] = true; src[i] = srcTag;
      // ani[i] 保持不变，使用初始化时的 emoji
    }
    // 播报当前列亮格总数（从上往下数，最底部亮格的位置 = 亮格数）
    speak(String(countColLit(arr, col, colEnd)));
  } else {
    // 点 ON → 向上全灭（到列首为止）
    for (let i = idx; i >= colStart; i--) {
      arr[i] = false;
    }
    // 播报灭掉后剩余亮格数
    speak(String(countColLit(arr, col, colEnd)));
  }
}

function checkFill(side, arr, target) {
  if (countOn(arr) === target) {
    if (side === 'left') {
      setTimeout(() => { speak('太棒啦！现在选右边'); beginPhase('right'); }, 400);
    } else {
      setTimeout(() => { speak('太棒啦！现在合并'); beginPhase('merge'); }, 400);
    }
  }
}

// ═══════════════════════════════════════════════════
//  合并
//  规则：
//   1. 只能点击非整十列（该列亮格数 1~9）
//   2. 点击 → 该列所有亮格全部尝试挪到对面多列（逐列填满）
//   3. 目标列找 lit<10 的列，按 lit 降序排，挨个列填满
//   4. 如果对面所有列都满了 → 报警
//   5. 合并完成：所有列要么0要么10
// ── 减法：检查被减数是否选够 ──
function checkFillSubMinuend() {
  if (countOn(leftOn) === a1) {
    setTimeout(() => {
      speak('太棒啦！现在标记要减去的' + a2 + '个');
      beginPhase('sub-subtrahend');
    }, 400);
  }
}

// ── 减法：检查减数标记是否够 ──
function checkFillSubtrahend() {
  if (subtrahendMarked.size === a2) {
    setTimeout(() => {
      speak('好！点击减掉按钮');
      beginPhase('sub-delete');
    }, 300);
  }
}

// ── 减法：减掉标记格子，动画后直接答题 ──
function doDeleteMarked() {
  if (subtrahendMarked.size === 0) return;
  playClick();
  document.getElementById('sub-delete-btn').classList.add('hidden');
  document.getElementById('sub-delete-area').classList.add('hidden');
  answerModeBtn.style.display = '';

  isAnimating = true;
  const cells = colLeft.querySelectorAll('.cell');
  const markedArr = [...subtrahendMarked].sort((a, b) => a - b);

  // 依次让每个标记格子变暗
  markedArr.forEach((idx, i) => {
    setTimeout(() => {
      if (cells[idx]) cells[idx].classList.remove('on', 'cell-color-0', 'cell-color-1', 'cell-color-2', 'cell-color-3', 'cell-color-4', 'slashed');
      leftOn[idx] = false;
      leftAnimal[idx] = 0;
    }, i * 80);
  });

  setTimeout(() => {
    subtrahendMarked.clear();
    // 把剩余亮格下沉到每列底部，空格留在上方，格子本身不消失
    const totalCols = Math.ceil(leftInitTotal / PER_COL);
    for (let c = 0; c < totalCols; c++) {
      const colStart = c * PER_COL;
      const colEnd = Math.min(colStart + PER_COL, leftInitTotal);
      // 收集该列剩余亮格
      const rem = [];
      for (let i = colStart; i < colEnd; i++) {
        if (leftOn[i]) rem.push({ animal: leftAnimal[i], src: srcLeft[i] });
      }
      // 清空该列
      for (let i = colStart; i < colEnd; i++) {
        leftOn[i] = false;
        leftAnimal[i] = 0;
        srcLeft[i] = '';
      }
      // 从底部填入（高 index = 视觉底部）
      const startRow = colEnd - rem.length;
      for (let r = 0; r < rem.length; r++) {
        const idx = startRow + r;
        leftOn[idx] = true;
        leftAnimal[idx] = rem[r].animal;
        srcLeft[idx] = rem[r].src;
      }
    }
    // 下一帧渲染，等浏览器先把删除动画 paint 完
    requestAnimationFrame(() => {
      renderCells();
      isAnimating = false;
      const remainCount = countOn(leftOn);
      if (remainCount > 0) {
        speak('减掉了，剩下' + remainCount + '个');
      } else {
        speak('全部减掉了，答案是0');
        enterAnswerState();
        return;
      }
      if (countNonRoundColsOnSide(leftOn, leftInitTotal) >= 2) {
        beginPhase('merge');
      } else {
        enterAnswerState();
      }
    });
  }, markedArr.length * 80 + 200);
}

// ═══════════════════════════════════════════════════
function doMerge(side, clickedIdx, clickedCol) {
  if (isAnimating) return;

  const fromLeft  = side === 'left';
  // 减法合并：源和目标都在左侧（排除源列）；加法合并：源左→右 或 源右→左
  const subMerge  = isSub && phase === 'merge';
  const fromArr   = fromLeft ? leftOn  : rightOn;
  const toArr    = subMerge ? leftOn : (fromLeft ? rightOn : leftOn);
  const fromAni  = fromLeft ? leftAnimal  : rightAnimal;
  const toAni    = subMerge ? leftAnimal : (fromLeft ? rightAnimal : leftAnimal);
  const fromSrc  = fromLeft ? srcLeft  : srcRight;
  const toSrc    = subMerge ? srcLeft : (fromLeft ? srcRight : srcLeft);
  const fromInit = fromLeft ? leftInitTotal  : rightInitTotal;
  const toInit   = subMerge ? leftInitTotal : (fromLeft ? rightInitTotal : leftInitTotal);

  const colStart = clickedCol * PER_COL;
  const colEnd   = Math.min(colStart + PER_COL, fromInit);

  // 收集该列中点击格子及以上的亮格（从 colStart 到 clickedIdx，视觉上往顶部方向）
  const litCells = [];
  for (let i = colStart; i <= clickedIdx; i++) {
    if (fromArr[i]) litCells.push(i);
  }
  if (litCells.length === 0) { speak('上面没有亮格'); return; }

  // 找目标侧所有可用列（lit>0 且 lit<10，即非空非整十），按 lit 降序排列
  const targetCols = [];
  const colCount = Math.ceil(toInit / PER_COL);
  for (let c = 0; c < colCount; c++) {
    if (subMerge && c === clickedCol) continue; // 减法合并排除源列
    const s = c * PER_COL, e = Math.min(s + PER_COL, toInit);
    let lit = 0;
    for (let i = s; i < e; i++) if (toArr[i]) lit++;
    if (lit > 0 && lit < PER_COL) targetCols.push({ col: c, lit, empty: PER_COL - lit, start: s, end: e });
  }
  if (targetCols.length === 0) {
    speak('放不下啦！');
    enterAnswerState(); return;
  }
  targetCols.sort((x, y) => y.lit - x.lit || x.col - y.col);

  // 逐列填满（从列底往上填），直到源格全部挪完或目标侧全满
  let moved = 0;
  let tcIdx = 0; // 当前目标列索引
  let targetPos = targetCols[0].end - 1; // 从列底（index 大）开始往上走

  isAnimating = true;
  colLeft.classList.add('highlight');
  colRight.classList.add('highlight');

  for (let fi of litCells) {
    // 找当前目标列的下一个空位（从列底往上找）
    while (tcIdx < targetCols.length) {
      const tc = targetCols[tcIdx];
      while (targetPos >= tc.start && toArr[targetPos]) targetPos--;
      if (targetPos >= tc.start) break; // 找到空位
      tcIdx++; // 当前列满，切下一列
      if (tcIdx < targetCols.length) targetPos = targetCols[tcIdx].end - 1;
    }
    if (tcIdx >= targetCols.length) break; // 目标侧全满，挪不动了

    // 执行挪动（放到找到的空位）
    toArr[targetPos] = true;
    toAni[targetPos]  = fromAni[fi];
    toSrc[targetPos]  = fromSrc[fi];
    fromArr[fi] = false;
    targetPos--; // 继续往上走
    moved++;
  }

  const total = countOn(leftOn) + countOn(rightOn);
  renderCells();
  isAnimating = false;
  colLeft.classList.remove('highlight');
  colRight.classList.remove('highlight');
  speak(String(moved));

  if (isMergeDone()) {
    // merge 已完成，直接进入答题状态
    phase = 'done';
    renderCells();
    speak('合并完成，一共' + total + '个，请作答');
    enterAnswerState();
  } else if (moved === 0) {
    // 完全没挪动（源列挪光了，目标侧全满）
    speak('放不下啦！');
    enterAnswerState();
  } else {
    // 挪动了但未完成，刷新提示
    if (!answerState) answerPrompt.textContent = '请合并方块';
  }
  phase = 'merge'; // 保持 merge 阶段（可继续尝试合并或直接答题）
}

// 统计某侧"非10非0"列数
function countNonRoundColsOnSide(arr, initTotal) {
  const cols = Math.ceil(initTotal / PER_COL);
  let count = 0;
  for (let c = 0; c < cols; c++) {
    let n = 0;
    for (let i = c * PER_COL; i < Math.min((c + 1) * PER_COL, initTotal); i++) {
      if (arr[i]) n++;
    }
    if (n > 0 && n < PER_COL) count++;
  }
  return count;
}

// 判定合并是否完成
// 规则：两侧"非10非0"列数 ≤ 1
function isMergeDone() {
  return countNonRoundColsOnSide(leftOn, leftInitTotal) +
         countNonRoundColsOnSide(rightOn, rightInitTotal) <= 1;
}

// ═══════════════════════════════════════════════════
//  阶段控制
// ═══════════════════════════════════════════════════
function beginPhase(p) {
  phase = p;
  answerState = false;

  // 统一重置答题区 UI → 显示默认行
  answerModeArea.classList.add('hidden');
  answerDefaultRow.style.display = '';
  answerModeBtn.style.display  = '';
  answerModeBtn.textContent   = '📝 答题';
  answerModeBtn.classList.remove('close-mode');
  answerCloseBtn.classList.add('hidden');
  document.getElementById('sub-delete-btn').classList.add('hidden');
  document.getElementById('sub-delete-area').classList.add('hidden');
  inputDigits = [];
  document.getElementById('answer-display').textContent = '';

  const fa1  = document.getElementById('formula-a1');
  const fa2  = document.getElementById('formula-a2');
  const fans = document.getElementById('formula-ans');
  fans.textContent = '?'; fans.classList.remove('ans-reveal');
  fa1.classList.remove('left-hl','right-hl');
  fa2.classList.remove('left-hl','right-hl');
  fa1.style.background = ''; fa1.style.color = '';
  fa2.style.background = ''; fa2.style.color = '';

  const lh = document.getElementById('left-hint');
  const rh = document.getElementById('right-hint');
  lh.classList.remove('left-hl','right-hl','merge-hl');
  rh.classList.remove('left-hl','right-hl','merge-hl');

  if (p === 'left') {
    fa1.classList.add('left-hl');
    lh.classList.add('left-hl'); rh.classList.add('right-hl');
    lh.textContent = '点击点亮'; rh.textContent = '等待';
    answerPrompt.textContent = '请选择' + a1 + '个方块';
    renderCells(); speak('请点亮' + a1 + '个');
  } else if (p === 'right') {
    fa2.classList.add('right-hl');
    lh.classList.remove('left-hl'); lh.classList.add('right-hl');
    rh.classList.remove('right-hl'); rh.classList.add('left-hl');
    lh.textContent = '完成'; rh.textContent = '点击点亮';
    answerPrompt.textContent = '请选择' + a2 + '个方块';
    renderCells(); speak('太棒啦！现在点亮' + a2 + '个');
  } else if (p === 'merge') {
    lh.classList.add('merge-hl'); rh.classList.add('merge-hl');
    lh.textContent = '合并'; rh.textContent = '合并';
    answerPrompt.textContent = '请合并方块';
    answerPrompt.style.color = '';
    answerPrompt.style.fontSize = '';
    leftUnlockedCols  = Math.ceil(leftInitTotal  / PER_COL);
    rightUnlockedCols = Math.ceil(rightInitTotal / PER_COL);
  } else if (p === 'sub-minuend') {
    // ── 减法阶段一：被减数 ──
    lh.classList.add('left-hl'); rh.classList.add('right-hl');
    lh.textContent = '点击点亮'; rh.textContent = '—';
    rh.style.opacity = '0.3';
    answerPrompt.textContent = '请选择' + a1 + '个方块';
    answerPrompt.style.color = '';
    answerPrompt.style.fontSize = '';
    renderCells(); speak('请点亮' + a1 + '个');
  } else if (p === 'sub-subtrahend') {
    // ── 减法阶段二：减数 ──
    lh.textContent = '选择减去'; rh.style.opacity = '';
    lh.classList.add('right-hl'); rh.classList.remove('right-hl');
    answerPrompt.textContent = '请标记' + a2 + '个方块';
    answerPrompt.style.color = '';
    answerPrompt.style.fontSize = '';
    renderCells();
    speak('太棒啦！请在亮格里标记要减去的' + a2 + '个');
  } else if (p === 'sub-delete') {
    // ── 减法阶段三：减掉 ──
    lh.textContent = '减掉'; rh.textContent = '—';
    lh.classList.remove('left-hl','right-hl'); lh.classList.add('merge-hl');
    answerPrompt.textContent = '➖ 请点击游戏区「减掉」按钮';
    answerPrompt.style.color = '#e53e3e';
    answerPrompt.style.fontSize = '20px';
    document.getElementById('sub-delete-area').classList.remove('hidden');
    document.getElementById('sub-delete-btn').classList.remove('hidden');
    renderCells();
    speak('请点击减掉按钮');
  }
}

// ═══════════════════════════════════════════════════
//  答题区状态切换
// ═══════════════════════════════════════════════════
function enterAnswerState() {
  if (answerState) return;  // 已在答题状态
  answerState = true;
  // 隐藏默认行，显示答题模式
  answerDefaultRow.style.display = 'none';
  answerModeArea.classList.remove('hidden');
  answerCloseBtn.classList.remove('hidden');
  answerPrompt.textContent = '请选择答案';

  // 构建数字键盘
  const numPad = document.getElementById('num-pad');
  numPad.innerHTML = '';
  for (let i = 0; i <= 9; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn'; btn.textContent = i;
    btn.addEventListener('click', () => { playClick(); onNumPad(i); });
    numPad.appendChild(btn);
  }
  document.getElementById('clr-btn').onclick = () => { playClick(); inputDigits = []; renderInputDisplay(); };
  document.getElementById('submit-btn').onclick = () => { playClick(); onSubmit(); };
  renderInputDisplay();
  speak('选答案');
}

function exitAnswerState() {
  answerState = false;
  // 隐藏答题模式，显示默认行
  answerModeArea.classList.add('hidden');
  answerCloseBtn.classList.add('hidden');
  answerDefaultRow.style.display = '';
  answerModeBtn.textContent   = '📝 答题';
  answerModeBtn.classList.remove('close-mode');
  inputDigits = [];
  document.getElementById('answer-display').textContent = '';
  // 恢复对应阶段提示
  if (phase === 'merge') answerPrompt.textContent = '请合并方块';
  else if (phase === 'left') answerPrompt.textContent = '请选择' + a1 + '个方块';
  else if (phase === 'right') answerPrompt.textContent = '请选择' + a2 + '个方块';
}

// ═══════════════════════════════════════════════════
//  数字填写 & 提交
// ═══════════════════════════════════════════════════
function renderInputDisplay() {
  const display = document.getElementById('answer-display');
  display.textContent = '';
  const digits = String(answer).length;  // 1 或 2
  for (let i = 0; i < digits; i++) {
    const s = document.createElement('span');
    s.className = 'ans-digit';
    if (i < inputDigits.length) { s.textContent = inputDigits[i]; s.classList.add('filled'); }
    else if (i === inputDigits.length) s.classList.add('cursor');
    display.appendChild(s);
  }
  document.getElementById('submit-btn').disabled = inputDigits.length !== digits;
}

function onNumPad(digit) {
  const digits = String(answer).length;
  if (inputDigits.length >= digits) return;
  inputDigits.push(digit);
  renderInputDisplay();
}

function onSubmit() {
  if (inputDigits.length !== String(answer).length) return;
  const val = parseInt(inputDigits.join(''), 10);
  if (val === answer) {
    playCorrect();
    spawnConfetti(); drawReward();
    questions[currentRound - 1].done = true;
    correctCount++; streakCount++;
    renderQuestionList();

    const fans = document.getElementById('formula-ans');
    fans.textContent = answer; fans.classList.add('ans-reveal');
    answerPrompt.textContent = '太棒啦！' + a1 + (isSub ? '−' : '+') + a2 + '=' + answer + '！';
    speak(a1 + (isSub ? '减' : '加') + a2 + '等于' + answer + '！太棒啦！');

    // 勋章
    if (streakCount >= 3) showMedal(streakCount);

    phase = 'done';
    setTimeout(() => {
      if (currentRound < questions.length) { currentRound++; newRound(); }
      else showScoreScreen();
    }, 2200);
  } else {
    roundWrongCount++; streakCount = 0; questions[currentRound - 1].hasWrong = true;
    playWrong();
    inputDigits = []; renderInputDisplay();
    const d = document.getElementById('answer-display');
    d.style.animation = 'none'; d.offsetHeight; d.style.animation = 'shake 0.4s';
    speak('再想想');
  }
}

// ═══════════════════════════════════════════════════
//  特效
// ═══════════════════════════════════════════════════
function spawnConfetti() {
  const colors = ['#FFD54F','#FF7043','#81C784','#CE93D8','#F48FB1','#80DEEA'];
  for (let i = 0; i < 45; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    const dur = 1.5 + Math.random() * 2;
    el.style.cssText = 'left:' + (Math.random()*100) + 'vw;width:' + (8+Math.random()*10) + 'px;height:' + (8+Math.random()*10) + 'px;background:' + colors[i%colors.length] + ';animation-duration:' + dur + 's;animation-delay:' + (Math.random()*0.8) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur+1)*1000);
  }
}

function drawReward() {
  rewardCvs.width = window.innerWidth; rewardCvs.height = window.innerHeight;
  const parts = CELEBS.slice(0,8).map((e,i) => ({
    text:e, x: window.innerWidth*(0.15+0.7*i/7),
    y: window.innerHeight*0.5, vx:(Math.random()-0.5)*4,
    vy: -6-Math.random()*4, life:1, size:28+Math.random()*20
  }));
  const tick = () => {
    rctx.clearRect(0,0,rewardCvs.width,rewardCvs.height);
    let alive = false;
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.022;
      if (p.life > 0) { alive = true; rctx.globalAlpha = Math.max(0,p.life); rctx.font = p.size+'px serif'; rctx.textAlign = 'center'; rctx.fillText(p.text,p.x,p.y); }
    });
    if (alive) requestAnimationFrame(tick);
    else rctx.clearRect(0,0,rewardCvs.width,rewardCvs.height);
  };
  tick();
}

function showMedal(n) {
  medalBanner.textContent = '🎖 连续答对 ' + n + ' 题！太厉害啦！';
  medalBanner.classList.add('show');
  speak('太厉害啦！连续答对' + n + '题！获得小勋章！');
  setTimeout(() => medalBanner.classList.remove('show'), 4000);
}

// ═══════════════════════════════════════════════════
//  结算
// ═══════════════════════════════════════════════════
function showScoreScreen() {
  phase = 'idle';
  const wrong = questions.filter(q => q.hasWrong).length;
  const pct   = Math.round((correctCount / questions.length) * 100);
  const stars = pct >= 90 ? '🌟🌟🌟' : pct >= 60 ? '🌟🌟' : '🌟';
  const msgs  = pct===100 ? ['满分！🎉','太厉害了，全对！'] :
                pct>=80  ? ['太棒啦！👏','答对'+correctCount+'题，继续加油！'] :
                pct>=50  ? ['还不错！💪','答对'+correctCount+'题，再接再厉！'] :
                           ['加油呀！🌱','答对'+correctCount+'题，多练练就能更好！'];
  scoreStars.textContent = stars;
  scorePct.textContent   = pct + '%';
  scoreTitle.textContent  = msgs[0];
  scoreDetail.innerHTML   = '答对 ' + correctCount + ' 题 · 答错 ' + wrong + ' 题<br>' + msgs[1];
  scoreScreen.classList.add('show');
  speak(msgs[0] + '！正确率' + pct + '%。' + msgs[1]);
}

// ═══════════════════════════════════════════════════
//  自定义出题键盘
// ═══════════════════════════════════════════════════
let customPhase = 'num1';
let customNum1 = '';
let customOp   = null;
let customNum2 = '';

function buildCustomPad() {
  const pad = document.getElementById('custom-pad');
  pad.innerHTML = '';
  // 4列网格：[内容, 类型]
  const rows = [
    [['1','num'],['2','num'],['3','num'],['+','op']],
    [['4','num'],['5','num'],['6','num'],['-','op']],
    [['7','num'],['8','num'],['9','num'],['⌫','del']],
    [['0','num'],['✓','conf'],['','empty'],['','empty']],
  ];
  rows.forEach(row => {
    row.forEach(([k, type]) => {
      if (k === '') {
        const spacer = document.createElement('div');
        pad.appendChild(spacer);
        return;
      }
      const btn = document.createElement('button');
      btn.className = 'c-key c-key-' + type;
      btn.textContent = k;
      btn.addEventListener('click', () => {
        if (type === 'conf') { submitCustomQuestion(); }
        else { onCustomKey(k); }
      });
      pad.appendChild(btn);
    });
  });
}

function refreshCustomPreview() {
  const preview    = document.getElementById('custom-preview');
  const errEl      = document.getElementById('custom-error');
  errEl.textContent = '';
  preview.classList.remove('error');
  let text = customNum1 || '_';
  if (customOp) text += ' ' + customOp + ' ';
  if (customOp) text += customNum2 || '_';
  preview.textContent = text;
  let err = '';
  const n1 = parseInt(customNum1, 10) || 0;
  const n2 = parseInt(customNum2, 10) || 0;
  if (customNum1 !== '' && (n1 < 1 || n1 > 99)) err = '第一个数请输入 1~99';
  else if (customNum1.startsWith('0') && customNum1.length > 1) err = '不能有前导零';
  else if (customOp && customNum2 !== '' && (n2 < 1 || n2 > 99)) err = '第二个数请输入 1~99';
  else if (customOp === '-' && customNum2 !== '' && n1 - n2 < 0) err = '结果不能为负数哦';
  else if (customOp && customNum2.startsWith('0') && customNum2.length > 1) err = '不能有前导零';
  if (err) {
    preview.classList.add('error');
    errEl.textContent = err;
  }
}

function onCustomKey(k) {
  if (k === '⌫') {
    if (customPhase === 'num2' && customNum2) customNum2 = customNum2.slice(0,-1);
    else if (customPhase === 'op') customPhase = 'num1';
    else if (customNum1) customNum1 = customNum1.slice(0,-1);
  } else if (k === '+' || k === '-') {
    if (customPhase === 'num1' && customNum1 !== '') { customOp = k; customPhase = 'num2'; }
  } else {
    if (customPhase === 'num1' && customNum1.length < 2) customNum1 += k;
    else if (customPhase === 'num2' && customNum2.length < 2) customNum2 += k;
  }
  refreshCustomPreview();
}

function openCustomKeypad() {
  if (currentRound === 0) { speak('请先开始游戏'); return; }
  customPhase = 'num1'; customNum1 = ''; customOp = null; customNum2 = '';
  buildCustomPad();
  refreshCustomPreview();
  document.getElementById('custom-keypad-overlay').classList.remove('hidden');
}

function closeCustomKeypad() {
  document.getElementById('custom-keypad-overlay').classList.add('hidden');
}

function submitCustomQuestion() {
  const n1 = parseInt(customNum1, 10);
  const n2 = parseInt(customNum2, 10);
  if (!n1 || !n2 || !customOp) return;
  const isSub = customOp === '-';
  const answer = isSub ? n1 - n2 : n1 + n2;
  if (answer < 0) return;
  const type = 'custom';
  const customQ = { a1: n1, a2: n2, answer, type, done: false, hasWrong: false, isCustom: true, isSub };
  questions.splice(currentRound - 1, 0, customQ);
  closeCustomKeypad();
  renderQuestionList();
  newRound();
}

document.getElementById('custom-q-btn').addEventListener('click', openCustomKeypad);
document.getElementById('custom-cancel-btn').addEventListener('click', closeCustomKeypad);

// ═══════════════════════════════════════════════════
//  新一局
// ═══════════════════════════════════════════════════
function newRound() {
  // 重置答题区
  answerState = false;
  answerModeArea.classList.add('hidden');
  answerCloseBtn.classList.add('hidden');
  answerDefaultRow.style.display = '';
  answerModeBtn.textContent   = '📝 答题';
  answerModeBtn.classList.remove('close-mode');
  inputDigits = [];
  document.getElementById('answer-display').textContent = '';

  const q = questions[currentRound - 1];
  a1 = q.a1; a2 = q.a2; answer = q.answer;
  isSub = q.isSub !== undefined ? q.isSub : q.type.startsWith('sub');
  subtrahendMarked.clear();
  roundWrongCount = 0;

  assignEmojis();
  
  // 先算好格子数，再分配数组
  if (isSub) {
    leftInitTotal  = Math.ceil(a1 / PER_COL) * PER_COL;
    rightInitTotal = 0;
    leftUnlockedCols  = Math.ceil(a1 / PER_COL);
    rightUnlockedCols = 0;
  } else {
    leftInitTotal  = Math.ceil(a1 / PER_COL) * PER_COL;
    rightInitTotal = Math.ceil(a2 / PER_COL) * PER_COL;
    leftUnlockedCols  = Math.ceil(leftInitTotal / PER_COL);
    rightUnlockedCols = Math.ceil(rightInitTotal / PER_COL);
  }
  
  // 数组按实际格子数分配
  const n = Math.max(TOTAL_CELLS, leftInitTotal, rightInitTotal);
  console.log('=== newRound ===');
  console.log('a1=', a1, 'leftInitTotal=', leftInitTotal, 'rightInitTotal=', rightInitTotal, 'n=', n);
  
  leftOn   = new Array(n).fill(false);
  rightOn  = new Array(n).fill(false);
  srcLeft  = new Array(n).fill('left');
  srcRight = new Array(n).fill('right');
  // 每道题随机选择 emoji
  assignEmojis();
  
  // 左侧所有格子用同一个 emoji，右侧所有格子用另一个 emoji
  leftAnimal  = new Array(n).fill(leftEmoji);
  rightAnimal = new Array(n).fill(rightEmoji);
  
  console.log('leftEmoji:', leftEmoji, 'rightEmoji:', rightEmoji);
  console.log('leftAnimal[0-9]:', leftAnimal.slice(0, 10).join(' '));
  console.log('leftAnimal[10-19]:', leftAnimal.slice(10, 20).join(' '));

  if (isSub) {
    // 减法：只建左侧，右侧空
    buildCol(colLeft,  leftInitTotal,  leftUnlockedCols);
    colRight.innerHTML = '';
  } else {
    // 加法：左右各建，全部解锁
    buildCol(colLeft,  leftInitTotal,  leftUnlockedCols);
    buildCol(colRight, rightInitTotal, rightUnlockedCols);
  }
  renderCells();
  renderQuestionList();

  // 更新算式区
  document.getElementById('formula-op').textContent  = isSub ? '−' : '+';
  document.getElementById('formula-op').style.color = isSub ? '#8E24AA' : 'var(--text-light)';
  document.getElementById('formula-a1').textContent = a1;
  document.getElementById('formula-a2').textContent = a2;
  const fans = document.getElementById('formula-ans');
  fans.textContent = '?'; fans.classList.remove('ans-reveal');
  document.getElementById('formula-a1').classList.remove('left-hl','right-hl');
  document.getElementById('formula-a2').classList.remove('left-hl','right-hl');
  document.getElementById('formula-a1').style.background = '';
  document.getElementById('formula-a1').style.color = '';
  document.getElementById('formula-a2').style.background = '';
  document.getElementById('formula-a2').style.color = '';

  beginPhase(isSub ? 'sub-minuend' : 'left');
}

// ═══════════════════════════════════════════════════
//  启动
// ═══════════════════════════════════════════════════
document.getElementById('qsel-minus').addEventListener('click', () => {
  playClick();
  if (totalQuestions > MIN_Q) { totalQuestions--; qselCount.textContent = totalQuestions; }
});
document.getElementById('qsel-plus').addEventListener('click', () => {
  playClick();
  if (totalQuestions < MAX_Q) { totalQuestions++; qselCount.textContent = totalQuestions; }
});
document.getElementById('start-btn').addEventListener('click', () => {
  const add20 = document.getElementById('qtype-add20').checked;
  const add40 = document.getElementById('qtype-add40').checked;
  const sub10 = document.getElementById('qtype-sub10').checked;
  const sub20 = document.getElementById('qtype-sub20').checked;
  const sub40 = document.getElementById('qtype-sub40').checked;
  if (!add20 && !add40 && !sub10 && !sub20 && !sub40) { alert('请至少选择一种题型！'); return; }
  playClick();
  setupScreen.style.display = 'none';
  currentRound = 1; correctCount = 0; streakCount = 0;
  generateQuestions();
  newRound();
});
document.getElementById('score-replay').addEventListener('click', () => {
  playClick();
  scoreScreen.classList.remove('show');
  setupScreen.style.display = 'flex';
});

// 答题区"答题"按钮
answerModeBtn.addEventListener('click', () => {
  enterAnswerState();
});

// 答题区"关闭答题"按钮
answerCloseBtn.addEventListener('click', () => {
  exitAnswerState();
});

// 减法"删除"按钮
document.getElementById('sub-delete-btn').addEventListener('click', () => {
  doDeleteMarked();
});
</script>
